name: Changelog Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-check:
    name: Verify changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md adds a substantive entry under ## [Unreleased]
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;

            // Step 1: verify the PR body has a Closes #N or Semver hint.
            const body = context.payload.pull_request.body || '';
            const hasCloses = /closes\s+#\d+/i.test(body);
            const hasSemver = /semver:\s*(patch|minor|major)/i.test(body);
            if (!hasCloses && !hasSemver) {
              core.setFailed(
                'PR body must include a changelog-relevant marker:\n' +
                '  - `Closes #N` (links the issue)\n' +
                '  - `Semver: patch|minor|major` (version hint)'
              );
              return;
            }

            // Step 2: fetch the unified diff for CHANGELOG.md between
            // base and head SHAs.
            const diff = await github.rest.repos.compareCommits({
              owner, repo,
              base: baseSha,
              head: headSha,
            });

            const files = diff.data.files || [];
            const changelogFile = files.find(f => f.filename === 'CHANGELOG.md');

            if (!changelogFile) {
              core.setFailed(
                'This PR does not modify CHANGELOG.md.\n' +
                'Please add a changelog entry under the `## [Unreleased]` section\n' +
                'describing what this PR changed.'
              );
              return;
            }

            // Step 3: reconstruct the post-change CHANGELOG.md from the
            // diff. In a unified diff, context lines start with ' ' (space)
            // and added lines start with '+'. The section headings are
            // CONTEXT lines (unchanged), not added lines — so we must
            // include context lines when reconstructing content to track
            // section state.
            const patch = changelogFile.patch || '';
            const contentLines = [];
            for (const line of patch.split('\n')) {
              if (line.startsWith('+') && !line.startsWith('+++')) {
                contentLines.push(line.slice(1));
              } else if (line.startsWith(' ') && !line.startsWith('---')) {
                contentLines.push(line.slice(1));
              }
              // Deleted lines ('-') are the pre-change content — skip.
            }

            // Walk the reconstructed post-change content, tracking section
            // state by '## [' headings, looking for substantive entries
            // under Unreleased.
            let inUnreleased = false;
            let hasSubstantiveEntry = false;

            for (const line of contentLines) {
              if (/^##\s+\[/i.test(line)) {
                inUnreleased = /unreleased/i.test(line);
                continue;
              }
              if (!inUnreleased) continue;

              const trimmed = line.trim();
              if (trimmed === '') continue;
              // Subsection headers (###) are structural, not entries.
              if (trimmed.startsWith('###')) continue;
              // A substantive entry: a bullet or non-heading content line.
              hasSubstantiveEntry = true;
              break;
            }

            if (!hasSubstantiveEntry) {
              core.setFailed(
                'CHANGELOG.md was modified but no substantive entry was found under the `## [Unreleased]` section.\n' +
                'Please add a bullet (e.g. `- Added feature X`) under `## [Unreleased]` describing what this PR changed.\n' +
                'Blank lines, section headers, and version headings do not count.'
              );
              return;
            }

            core.info('CHANGELOG.md Unreleased section updated ✓');
