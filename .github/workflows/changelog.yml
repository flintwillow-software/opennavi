name: Changelog Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-check:
    name: Verify changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for changelog markers
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const hasCloses = /closes\s+#\d+/i.test(body);
            const hasSemver = /semver:\s*(patch|minor|major)/i.test(body);
            if (!hasCloses && !hasSemver) {
              core.setFailed(
                'PR body must include a changelog-relevant marker:\n' +
                '  - `Closes #N` (links the issue)\n' +
                '  - `Semver: patch|minor|major` (version hint)\n' +
                'See .github/workflows/changelog.yml for details.'
              );
            }
