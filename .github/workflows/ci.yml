name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The component packages, `datastore`, and `principal` are the public
      # surface (ADR 0004); none may import runtime internals. Added in
      # NAVI-356; the last exception (connector/cron -> internal/cron) was
      # removed in NAVI-359, so this now covers every public package with no
      # exceptions. NAVI-403 adds `principal` to the contract layer.
      - name: Public packages import no runtime internals
        run: |
          violations="$(grep -rn '"github.com/flintwillow-software/opennavi/internal/' \
            --include='*.go' tool thought connector portal model skill datastore principal \
            | grep -v '_test.go' || true)"
          if [ -n "$violations" ]; then
            echo "public packages import runtime internals:"
            echo "$violations"
            exit 1
          fi

      # -race is a merge gate: local development on the bastilli Pi
      # cannot run the race detector (ThreadSanitizer VMA limitation),
      # so CI is the only place it runs.
      - name: Test (race detector)
        run: go test -race -timeout 10m ./...

  templates:
    name: starter templates (guardrail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The templates are nested modules pinned to the published SDK
      # (no replace directive shipped). The go.work here is
      # CI-only: it builds the templates against the SDK in this
      # checkout, so a change that breaks the public authoring surface
      # fails this job on the PR.
      - name: Build starter templates against SDK
        run: |
          cat > go.work <<'EOF'
          go 1.26

          use (
          	.
          	./templates/navi-code
          	./templates/navi-daemon
          	./templates/navi-sqlite
          )

          replace github.com/flintwillow-software/opennavi v0.1.0 => .
          EOF
          (cd templates/navi-code && go build ./... && go vet ./... && go test ./...)
          (cd templates/navi-daemon && go build ./... && go vet ./... && go test ./...)
          (cd templates/navi-sqlite && go build ./... && go vet ./... && go test ./...)

  external-consumer:
    name: external modules — out-of-repo navi + component + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Both modules below carry their own replace directive, exactly as a
      # downstream repo does — no CI workspace is created for them, so the
      # build exercises the same go.mod a real consumer would ship.

      # internal/testdata/external-component is a synthetic OUT-OF-REPO component
      # module (ADR 0004, docs/architecture/extension-model.md). Its own
      # code may import only public contract packages and its dependency
      # closure must not reach the composition root or runtime internals.
      # This is the boundary a third-party tool/skill/model/connector/portal
      # author relies on, so a leak fails here, on the PR.
      - name: Check the external component's import boundary
        working-directory: internal/testdata/external-component
        run: |
          bad="$(go list -f '{{join .Imports "\n"}}' ./... \
            | grep '^github.com/flintwillow-software/opennavi/' \
            | grep -vE '^github.com/flintwillow-software/opennavi/(tool|thought|connector|portal|model|skill|datastore|object|principal)$' || true)"
          if [ -n "$bad" ]; then
            echo "external component imports non-contract packages:"
            echo "$bad"
            exit 1
          fi

          leaked="$(go list -deps -f '{{.ImportPath}}' ./... \
            | grep -E '^github.com/flintwillow-software/opennavi/(navi|internal)(/|$)' || true)"
          if [ -n "$leaked" ]; then
            echo "external component leaks runtime dependencies:"
            echo "$leaked"
            exit 1
          fi

          # NAVI-355: the closure must be CONTRACT-PURE. Importing a contract
          # package must not transitively pull an implementation package
          # (datastore/sqlite, tool/registry, ...) — the contract layer is
          # stdlib-only, and that is the invariant an out-of-repo author
          # relies on. NAVI-375 adds `datastore` to that contract layer, and
          # NAVI-403 adds `principal` (the identity reference) to it.
          impure="$(go list -deps -f '{{.ImportPath}}' ./... \
            | grep '^github.com/flintwillow-software/opennavi/' \
            | grep -vE '^github.com/flintwillow-software/opennavi/(tool|thought|connector|portal|model|skill|datastore|object|principal)$' || true)"
          if [ -n "$impure" ]; then
            echo "external component's contract closure is not contract-pure:"
            echo "$impure"
            exit 1
          fi

      - name: Build and run the external component
        working-directory: internal/testdata/external-component
        run: |
          go build ./...
          go vet ./...
          go run ./cmd/check

      # internal/testdata/external-navi is a synthetic OUT-OF-REPO navi: it imports
      # the public composition root (navi) plus contract packages and the
      # component module above, composes a navi, and validates it.
      - name: Build and run the external navi
        working-directory: internal/testdata/external-navi
        run: |
          go build ./...
          go vet ./...
          go run .

      # internal/testdata/external-backend is a synthetic OUT-OF-REPO datastore
      # backend (NAVI-376). It imports the public contract plus the contract's
      # SHARED CONFORMANCE SUITE and runs it against its own implementation —
      # which is what proves the suite belongs to the contract rather than being
      # a helper only the in-repo backends can use. The boundary is checked
      # exactly as for a third-party backend author.
      - name: Check the external backend's import boundary
        working-directory: internal/testdata/external-backend
        run: |
          # Direct imports INCLUDE test imports ({{join .TestImports}}): that is
          # where this module imports the conformance suite, and a guard that
          # only read {{join .Imports}} would not see it.
          bad="$(go list -f '{{join .Imports "\n"}}{{join .TestImports "\n"}}' ./... \
            | grep '^github.com/flintwillow-software/opennavi/' \
            | grep -vE '^github.com/flintwillow-software/opennavi/(thought|datastore|datastore/conformance|principal)$' || true)"
          if [ -n "$bad" ]; then
            echo "external backend imports non-contract packages:"
            echo "$bad"
            exit 1
          fi

          # -test: the closure must include test-only dependencies for the
          # check to mean anything here.
          leaked="$(go list -test -deps -f '{{.ImportPath}}' ./... \
            | grep -E '^github.com/flintwillow-software/opennavi/(navi|internal|datastore/(inmem|fs|sqlite))(/|$)' || true)"
          if [ -n "$leaked" ]; then
            echo "external backend leaks runtime or implementation dependencies:"
            echo "$leaked"
            exit 1
          fi

          impure="$(go list -test -deps -f '{{.ImportPath}}' ./... \
            | grep '^github.com/flintwillow-software/opennavi/' \
            | grep -vE '^github.com/flintwillow-software/opennavi/(thought|datastore|datastore/conformance|principal)$' || true)"
          if [ -n "$impure" ]; then
            echo "external backend's contract closure is not contract-pure:"
            echo "$impure"
            exit 1
          fi

      - name: Run the conformance suite against the external backend
        working-directory: internal/testdata/external-backend
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
