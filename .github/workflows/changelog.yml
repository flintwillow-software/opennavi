name: Changelog Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-check:
    name: Verify changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Check CHANGELOG.md adds a substantive entry under ## [Unreleased]
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;

            // Step 1: verify the PR body has a Closes #N or Semver hint.
            const body = context.payload.pull_request.body || '';
            const hasCloses = /closes\s+#\d+/i.test(body);
            const hasSemver = /semver:\s*(patch|minor|major)/i.test(body);
            if (!hasCloses && !hasSemver) {
              core.setFailed(
                'PR body must include a changelog-relevant marker:\n' +
                '  - `Closes #N` (links the issue)\n' +
                '  - `Semver: patch|minor|major` (version hint)'
              );
              return;
            }

            // Step 2: fetch the CHANGELOG.md content at base and head SHAs
            // via getContent — assess against the REAL file content, not a
            // diff reconstruction (diff hunks can omit section headings
            // that are far from the edit).
            async function fetchChangelog(sha) {
              const resp = await github.rest.repos.getContent({
                owner, repo,
                path: 'CHANGELOG.md',
                ref: sha,
              });
              if (Array.isArray(resp.data)) {
                throw new Error('CHANGELOG.md is a directory, not a file');
              }
              return Buffer.from(resp.data.content, 'base64').toString('utf-8');
            }

            let baseContent, headContent;
            try {
              baseContent = await fetchChangelog(baseSha);
            } catch (e) {
              // CHANGELOG.md doesn't exist at base — that's fine, the head
              // must have added it with an Unreleased section.
              baseContent = '';
            }
            headContent = await fetchChangelog(headSha);

            // Extract the lines within the ## [Unreleased] section.
            function extractUnreleasedLines(content) {
              const lines = content.split('\n');
              const out = [];
              let inSection = false;
              for (const line of lines) {
                if (/^##\s+\[/i.test(line)) {
                  inSection = /unreleased/i.test(line);
                  continue;
                }
                if (/^##\s/.test(line)) {
                  // A different ## section (not a ## [x] version heading)
                  // also ends the Unreleased scope.
                  if (inSection) inSection = false;
                  continue;
                }
                if (inSection && line.trim() !== '') {
                  out.push(line.trim());
                }
              }
              return out;
            }

            const baseLines = extractUnreleasedLines(baseContent);
            const headLines = extractUnreleasedLines(headContent);

            // Check that the head has at least one MORE substantive line
            // than the base (i.e. the PR actually added something).
            const baseSet = new Set(baseLines);
            const newLines = headLines.filter(l => !baseSet.has(l));

            if (newLines.length === 0) {
              core.setFailed(
                'CHANGELOG.md was not modified or no new entry was added under the `## [Unreleased]` section.\n' +
                'Please add a bullet (e.g. `- Added feature X`) under `## [Unreleased]` describing what this PR changed.'
              );
              return;
            }

            core.info(`CHANGELOG.md Unreleased section has ${newLines.length} new line(s): ${JSON.stringify(newLines)}`);
