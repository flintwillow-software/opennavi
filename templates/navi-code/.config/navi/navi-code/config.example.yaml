# Runtime config for navi-code.
#
# This is the operator/end-user deployment surface — it never modifies the
# compiled navi definition, and it can only NARROW the compiled policy.
# Point navi-code at it with NAVI_CONFIG (e.g. NAVI_CONFIG=config.yaml).
#
# Merge chain for the provider default: env > this file > build time
# (NAVI_PROVIDER / NAVI_MODEL override the file; OLLAMA_HOST overrides the
# endpoint).

provider:
  # primary: ollama | openrouter
  primary: ollama
  # model: qwen3.8:27b
  # endpoint: http://localhost:11434
  # Optional fallback provider, tried when the primary fails (ADR 0009).
  # fallback: openrouter

# Per-tool policy: blocked wins over allowed; an end user may only narrow
# the compiled ceiling, never widen it.
tools:
  blocked:
    - shell_exec

# Optional tool caps (note storage, http egress). Zero fields keep the
# safe package defaults.
# tool_caps:
#   notes:
#     max_body_bytes: 65536
#     max_navi_bytes: 10485760
#   http:
#     max_response_bytes: 262144
#     allowlist:
#       - internal.example
#     denylist:
#       - example.com

# Session/thought SQLite database.
session_db: ./navi-code.db

# Optional queue tuning.
# thought_queue:
#   max_concurrent: 2
#   priority_slots: 1