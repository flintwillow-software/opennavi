# Runtime config for navi-daemon.
#
# This is the operator's deployment surface — it never modifies the
# compiled navi definition. Point navi-daemon at it with NAVI_CONFIG.
#
# Merge chain for the provider default: env > this file > build time
# (NAVI_PROVIDER / NAVI_MODEL override the file; OLLAMA_HOST overrides the
# endpoint).

provider:
  primary: ollama
  model: llama3.1
  # Optional fallback provider, tried when the primary fails (ADR 0009).
  # fallback: openrouter

# Session/thought SQLite database (the daemon's durable state).
session_db: /var/lib/navi-daemon/daemon.db

# Thought queue tuning.
thought_queue:
  max_concurrent: 2
  priority_slots: 1

# Cron schedules: each is a thought factory (ADR 0010). `expr` is a
# 5-field cron expression; `enabled: false` registers but never fires.
cron:
  schedules:
    - name: morning-digest
      expr: "0 8 * * *"
      prompt: "Summarize overnight queued work and surface anything blocked."
      priority: 3
      # tz: America/Los_Angeles
      # enabled: true

# Per-tool policy: end users may only narrow the compiled ceiling.
tools:
  blocked:
    - shell_exec